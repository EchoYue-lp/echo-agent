[package]
name = "echo_macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Procedural macros for the echo-agent framework"
repository = "https://github.com/EchoYue-lp/echo-agent"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
