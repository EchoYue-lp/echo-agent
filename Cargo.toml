[workspace]
members = [
    "echo-agent-learning",
    "echo-core",
    "echo-macros",
    "echo-execution",
    "echo-integration",
    "echo-tools",
    "echo-state",
    "echo-orchestration",
    "echo-sdk-protocol",
]
default-members = [
    ".",
    "echo-agent-learning",
    "echo-core",
    "echo-macros",
    "echo-execution",
    "echo-integration",
    "echo-tools",
    "echo-state",
    "echo-orchestration",
    "echo-sdk-protocol",
]
resolver = "3"

[package]
name = "echo_agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Production-grade AI Agent framework for Rust — ReAct engine, multi-agent, memory, streaming, MCP, IM channels, workflows"
repository = "https://github.com/EchoYue-lp/echo-agent"
homepage = "https://github.com/EchoYue-lp/echo-agent"
documentation = "https://docs.rs/echo_agent"
readme = "README.md"
keywords = ["ai", "agent", "llm", "react", "mcp"]
categories = ["development-tools", "asynchronous", "web-programming::http-client"]

exclude = [
    "/docs/internal/",
    ".github/",
    ".claude/",
    ".idea/",
    ".env",
    ".env1",
    ".example.env",
    "mcp.json.example",
    "mcp.json",
    ".playwright-mcp/",
    "**/.DS_Store",
    "Cargo.lock",
    "cargo",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["a2a", "mcp", "lsp", "telemetry", "human-loop", "topology", "subagent", "web", "media", "sqlite", "channels", "git", "database", "rag", "chart", "content-guard", "project-rules", "eval", "improve", "statistics"]
rustdoc-args = ["--cfg", "docsrs"]
# NOTE: `data` (polars) is still excluded from docs.rs. polars-ops 0.46–0.53
# broke nightly builds by unconditionally enabling its `nightly` cfg and then
# using `core::unicode::{Case_Ignorable, Cased}` (removed in Rust 1.97);
# polars 0.55 vendors those tables (upstream fix polars#67422be6) and compiles
# on nightly again — contracts/sdk/toolchain.json pins a nightly toolchain for
# the SDK facade inventory, which covers `data`. Re-enabling `data` on docs.rs
# still needs its own verification against the docs.rs builder before shipping.

[features]
default = []
full = ["a2a", "mcp", "lsp", "telemetry", "human-loop", "topology", "subagent", "web", "media", "data", "sqlite", "channels", "git", "database", "rag", "chart", "content-guard", "project-rules", "shell", "files", "research", "eval", "improve", "statistics", "testing"]
a2a = ["dep:axum", "dep:jsonwebtoken"]
mcp = ["echo_integration/mcp"]
lsp = ["echo_core/lsp", "echo_integration/lsp"]
sqlite = ["echo_state/sqlite", "dep:rusqlite"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
human-loop = ["echo_orchestration/websocket"]
topology = []
# Task APIs are part of the framework core; there is no separate task feature.
subagent = []
web = ["echo_tools/web"]
media = ["echo_tools/media"]
data = ["echo_tools/data"]
statistics = ["echo_tools/statistics"]
channels = ["echo_integration/channels"]
git = ["echo_tools/git"]
database = ["echo_tools/database"]
rag = ["echo_tools/rag"]
chart = ["echo_tools/chart"]
content-guard = ["echo_core/guard"]
project-rules = []
shell = ["echo_tools/shell"]
files = ["echo_tools/files"]
research = ["echo_tools/research"]
eval = []
improve = []
testing = []

[dependencies]
echo_core = { version = "0.2.0", path = "echo-core", features = ["reqwest", "permission"] }
echo_macros = { version = "0.2.0", path = "echo-macros" }
echo_execution = { version = "0.2.0", path = "echo-execution", default-features = false }
echo_integration = { version = "0.2.0", path = "echo-integration" }
echo_tools = { version = "0.2.0", path = "echo-tools" }
echo_state = { version = "0.2.0", path = "echo-state" }
echo_orchestration = { version = "0.2.0", path = "echo-orchestration" }
reqwest = { version = "0.12.23", features = ["json", "stream"] }
async-stream = "0.3"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs", "signal", "process"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1.0.143"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10"
schemars = "0.8"
dotenvy = "0.15"
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
similar = "2"
chrono = { version = "0.4", features = ["serde"] }
shlex = "1"
async-trait = "0.1"
tempfile = "3"
fastrand = "2"
base64 = "0.22"
# Advisory file locks (cross-process, kill-safe: the lock is released when the
# fd is closed by the OS on process death, unlike a sidecar lock file which
# survives a kill -9 and deadlocks all future lockers). Used by the Curator
# and memory-layer state files.
fs2 = "0.4"
opentelemetry = { version = "0.27", features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
axum = { version = "0.7", optional = true }
# Optional A2A JWT verification. JwtConfig binds each accepted algorithm to the
# matching key family and never accepts caller-supplied mixed algorithm lists.
jsonwebtoken = { version = "9", optional = true }
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "agent_bench"
harness = false

[[bench]]
name = "journal_bench"
harness = false
