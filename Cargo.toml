[workspace]
members = [".", "echo-core", "echo-macros", "echo-execution", "echo-integration", "echo-state", "echo-orchestration"]

[package]
name = "echo_agent"
version = "1.4.0"
edition = "2024"

[features]
default = ["full"]
full = ["a2a", "mcp", "telemetry", "plan-execute", "human-loop", "handoff", "topology", "tasks", "workflow", "self-reflection", "subagent", "web", "media", "data", "sqlite", "channels"]
a2a = []
mcp = []
sqlite = ["echo_state/sqlite"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
plan-execute = []
human-loop = ["echo_orchestration/websocket"]
handoff = []
topology = []
tasks = []
workflow = []
self-reflection = []
subagent = []
web = ["dep:scraper", "dep:html2text", "dep:url"]
media = ["dep:pdf-extract", "dep:lopdf", "dep:calamine", "dep:docx-rs", "dep:encoding_rs"]
data = ["dep:polars"]
channels = []

[dependencies]
echo_core = { version = "1.4.0", path = "echo-core", features = ["reqwest", "guard"] }
echo_macros = { version = "1.4.0", path = "echo-macros" }
echo_execution = { version = "1.4.0", path = "echo-execution" }
echo_integration = { version = "1.4.0", path = "echo-integration" }
echo_state = { version = "1.4.0", path = "echo-state" }
echo_orchestration = { version = "1.4.0", path = "echo-orchestration" }
reqwest = { version = "0.12.23", features = ["json", "stream"] }
async-stream = "0.3"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1.0.143"
serde = { version = "1.0.228", features = ["derive"] }
schemars = "0.8"
dotenv = "0.15"
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
async-trait = "0.1"
fastrand = "2"
base64 = "0.22"
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
scraper = { version = "0.22", optional = true }
html2text = { version = "0.14", optional = true }
url = { version = "2", optional = true }
pdf-extract = { version = "0.7", optional = true }
lopdf = { version = "0.34", optional = true }
calamine = { version = "0.26", optional = true }
docx-rs = { version = "0.4", optional = true }
encoding_rs = { version = "0.8", optional = true }
polars = { version = "0.46", features = ["lazy", "csv", "json", "parquet", "dtype-full"], optional = true }

[[example]]
name = "demo27_sqlite_memory"
required-features = ["sqlite"]

[[example]]
name = "comprehensive_customer_service"
required-features = ["sqlite"]

[[example]]
name = "comprehensive_personal_assistant"
required-features = ["sqlite"]

[[example]]
name = "comprehensive_data_analyst"
required-features = ["sqlite"]

[[example]]
name = "comprehensive_research_agent"
required-features = ["sqlite"]

[[example]]
name = "demo38_im_channels"
required-features = ["channels"]

[[example]]
name = "demo41_web_tools"
required-features = ["web"]

[[example]]
name = "demo42_browser_mcp"
path = "examples/demo42_playwright_mcp.rs"
required-features = ["mcp"]
