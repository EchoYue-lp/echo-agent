[workspace]
members = [".", "echo-core", "echo-macros", "echo-providers", "echo-mcp", "echo-channels"]

[package]
name = "echo_agent"
version = "1.3.0"
edition = "2024"

[features]
default = ["full"]
full = ["a2a", "mcp", "telemetry", "plan-execute", "human-loop", "handoff", "topology", "tasks", "workflow", "self-reflection", "subagent"]
a2a = []
mcp = ["dep:echo_mcp"]
sqlite = ["dep:rusqlite"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
plan-execute = []
human-loop = ["dep:tokio-tungstenite"]
handoff = []
topology = []
tasks = []
workflow = []
self-reflection = []
subagent = []
channels = ["dep:echo_channels"]

[dependencies]
echo_core = { path = "echo-core", features = ["reqwest"] }
echo_macros = { path = "echo-macros" }
echo_providers = { path = "echo-providers" }
echo_mcp = { path = "echo-mcp", optional = true }
echo_channels = { path = "echo-channels", optional = true }
reqwest = { version = "0.12.23", features = ["json", "stream"] }
async-stream = "0.3"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1.0.143"
serde = { version = "1.0.228", features = ["derive"] }
schemars = "0.8"
dotenv = "0.15"
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"
tokio-tungstenite = { version = "0.24", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
dashmap = "6"
async-trait = "0.1"
fastrand = "2"
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[[example]]
name = "demo27_sqlite_memory"
required-features = ["sqlite"]

[[example]]
name = "demo38_im_channels"
required-features = ["channels"]
