[project]
name = "echo-agent-sdk-source"
version = "0.1.0"
description = "Source-built Python ACP client for echo-agent"
requires-python = ">=3.10"
dependencies = [
  "agent-client-protocol==0.12.1",
  "typing-extensions>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/echo_agent_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
