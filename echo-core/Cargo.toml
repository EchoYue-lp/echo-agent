[package]
name = "echo_core"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Core traits and types for the echo-agent framework"
repository = "https://github.com/EchoYue-lp/echo-agent"
homepage = "https://github.com/EchoYue-lp/echo-agent"
documentation = "https://docs.rs/echo_core"
keywords = ["ai", "agent", "llm", "framework"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

exclude = ["**/.DS_Store"]

[features]
default = []
reqwest = ["dep:reqwest"]
guard = ["dep:regex"]
permission = ["dep:globset"]
mcp = []
lsp = []
channels = []

[dependencies]
thiserror = "2"
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
rand = { version = "0.9", features = ["small_rng"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", optional = true }
regex = { version = "1", optional = true }
globset = { version = "0.4", optional = true }
