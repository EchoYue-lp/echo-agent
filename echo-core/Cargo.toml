[package]
name = "echo_core"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Core traits and types for the echo-agent framework"
repository = "https://github.com/EchoYue-lp/echo-agent"
homepage = "https://github.com/EchoYue-lp/echo-agent"
documentation = "https://docs.rs/echo_core"
keywords = ["ai", "agent", "llm", "framework"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

exclude = ["**/.DS_Store"]

[features]
default = []
reqwest = ["dep:reqwest"]
guard = []
permission = ["dep:globset"]
mcp = []
lsp = []
channels = []

[dependencies]
thiserror = "2"
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
schemars = "0.8"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "rt-multi-thread"] }
rand = { version = "0.9", features = ["small_rng"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.12", optional = true }
regex = "1"
globset = { version = "0.4", optional = true }
libc = "0.2"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
