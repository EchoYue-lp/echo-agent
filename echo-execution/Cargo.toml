[package]
name = "echo_execution"
version = "1.3.0"
edition = "2024"
description = "Execution layer for echo-agent framework (sandbox, skills, tools)"

[dependencies]
echo_core = { version = "1.3.0", path = "../echo-core" }
# From echo-sandbox
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "time", "macros", "rt", "io-util", "sync", "fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# From echo-skills
serde_yaml = "0.9"
regex = "1"
dirs = "6"
shlex = "1"
glob = "0.3"
