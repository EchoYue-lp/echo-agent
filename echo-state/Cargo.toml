[package]
name = "echo_state"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "State management for echo-agent framework (memory, compression, audit)"
repository = "https://github.com/EchoYue-lp/echo-agent"
homepage = "https://github.com/EchoYue-lp/echo-agent"
documentation = "https://docs.rs/echo_state"
keywords = ["ai", "agent", "memory", "state"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

exclude = ["**/.DS_Store"]

[features]
sqlite = ["dep:rusqlite"]

[dependencies]
echo_core = { version = "0.2.0", path = "../echo-core" }
# From echo-memory
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "fs", "macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
futures = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
reqwest = { version = "0.12", features = ["json"] }
# From echo-compression (no extra deps beyond echo_core)
# From echo-audit (no extra deps beyond echo_core)
