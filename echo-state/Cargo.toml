[package]
name = "echo_state"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "State management for echo-agent framework (memory, compression, audit)"
repository = "https://github.com/EchoYue-lp/echo-agent"

[features]
sqlite = ["dep:rusqlite"]

[dependencies]
echo_core = { version = "0.1.1", path = "../echo-core" }
# From echo-memory
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "fs", "macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
reqwest = { version = "0.12", features = ["json"] }
# From echo-compression (no extra deps beyond echo_core)
# From echo-audit (no extra deps beyond echo_core)

[dev-dependencies]
# echo_integration and reqwest needed for compression tests (#[ignore] by default)
echo_integration = { version = "0.1.1", path = "../echo-integration" }
