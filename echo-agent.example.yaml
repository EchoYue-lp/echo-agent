# echo-agent 完整示例配置
#
# 使用方式（按优先级查找）：
#   1. 设置环境变量 ECHO_AGENT_CONFIG 指向此文件
#   2. 复制到项目根目录并重命名为 echo-agent.yaml
#   3. 复制到 ~/.echo-agent/config.yaml
#
# 语法说明：
#   - ${VAR_NAME} 会被解析为对应的环境变量值
#   - provider 字段可替代 base_url，自动填充已知厂商的默认地址
#   - models.*.model 字段可选，默认使用配置的 key 名称
#   - 支持的 provider: openai, anthropic, deepseek, dashscope/qwen/aliyun,
#                       moonshot/kimi, zhipu/glm, ollama
#   - `model.name` 应引用 `models` 中已经声明好的一个 key
#   - 本文件同时包含两类配置：
#       1) `models` / `embedding`：供 ProviderFactory、语义检索等使用
#       2) `model` / `agent` / `channels` / `mcp` / `server` / `logging`：
#          供 `echo_agent::config` 运行时配置使用

models:
  # ── 阿里云百炼（DashScope）──────────────────────────────────────────────
  qwen3.7-max:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    api_key: ${DASHSCOPE_API_KEY}

  qwen3.7-plus:
    provider: dashscope
    api_key: ${DASHSCOPE_API_KEY}

  # 使用 provider 快捷方式（等效于上面手动填 base_url）
  qwen3-plus:
    provider: dashscope
    api_key: ${DASHSCOPE_API_KEY}

  # ── DeepSeek ────────────────────────────────────────────────────────────
  deepseek-v4-flash:
    provider: deepseek
    api_key: ${DEEPSEEK_API_KEY}

  # deepseek-v4-pro:
  #   provider: deepseek
  #   api_key: ${DEEPSEEK_API_KEY}

  # ── OpenAI ──────────────────────────────────────────────────────────────
  # gpt-5.5:
  #   provider: openai
  #   api_key: ${OPENAI_API_KEY}

  # ── Anthropic ───────────────────────────────────────────────────────────
  # claude-opus-4-8:
  #   provider: anthropic
  #   api_key: ${ANTHROPIC_API_KEY}

  # ── Moonshot / Kimi ─────────────────────────────────────────────────────
  # kimi-k2.6:
  #   provider: moonshot
  #   api_key: ${MOONSHOT_API_KEY}

  # ── 智谱 GLM ────────────────────────────────────────────────────────────
  # glm-5.1:
  #   provider: zhipu
  #   api_key: ${ZHIPU_API_KEY}

  # ── Ollama（本地）───────────────────────────────────────────────────────
  # llama3.1:
  #   provider: ollama
  #   api_key: ollama

  # ── 自定义端点 ──────────────────────────────────────────────────────────
  # my-custom-model:
  #   base_url: https://my-proxy.example.com/v1/chat/completions
  #   api_key: ${MY_API_KEY}
  #   model: gpt-5.5          # 实际发送给 API 的模型名（默认使用 key）

# ── Embedding（供语义检索 / 向量记忆使用）────────────────────────────────────
embedding:
  # 二选一：
  # 1) 完整 embeddings 端点
  # endpoint_url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
  # 2) 仅 base URL（会自动追加 /v1/embeddings）
  base_url: https://api.openai.com
  api_key: ${OPENAI_API_KEY}
  model: text-embedding-3-small
  timeout_secs: 30

# ── Runtime 配置（供 echo_agent::config 使用）───────────────────────────────
model:
  name: qwen3.7-plus
  max_tokens: 4096
  temperature: 0.7

agent:
  name: echo-assistant
  system_prompt: "你是 Echo Agent，一个运行在用户本机的实用 AI agent。你面向真实软件、研究、数据和运维任务：先基于上下文确认事实，再使用工具推进任务、保护用户已有工作、优先修根因、尽量验证结果，并给出简洁且有证据支撑的结论。"
  max_iterations: 10
  enable_tools: true
  enable_memory: true
  enable_human_in_loop: true
  memory_path: ~/.echo-agent/memory
  # Default timeout (seconds) for ANY subagent dispatch (Sync/Fork/Teammate).
  # 0 = no timeout. Default 600 (10 min) — deep tasks on large projects often
  # need more than the old 5-min/none limits. Per-subagent override in code.
  subagent_timeout_secs: 600

channels:
  # QQ Bot 通道
  qq:
    enabled: false
    app_id: ${QQ_APP_ID}
    client_secret: ${QQ_CLIENT_SECRET}

  # 飞书通道
  feishu:
    enabled: false
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}
    mode: long_poll   # long_poll | webhook

  # IM 会话配置
  session:
    timeout_minutes: 60
    reset_keywords:
      - 重置对话
      - 新对话
      - 清除记忆
    reset_commands:
      - /reset
      - /clear
      - /new

mcp:
  config_path: ./mcp.json

server:
  host: 0.0.0.0
  port: 3000

logging:
  level: info
