# echo-agent 完整示例配置
#
# 使用方式（按优先级查找）：
#   1. 设置环境变量 ECHO_AGENT_CONFIG 指向此文件
#   2. 复制到项目根目录并重命名为 echo-agent.yaml
#   3. 复制到 ~/.echo-agent/config.yaml
#
# 语法说明：
#   - ${VAR_NAME} 会被解析为对应的环境变量值
#   - Provider 只保存连接和认证；每个模型明确保存 API 协议和输入能力
#   - api_protocol: responses / chat_completions / anthropic
#   - input_modalities: text（默认）、image、audio、video
#   - 思考协议和有效等级由中央 ThinkingProfile 自动解析，不写入配置

model_providers:
  deepseek:
    name: DeepSeek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_api_protocol: chat_completions
    requires_api_key: true

configured_models:
  - id: deepseek:deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    provider: deepseek
    model: deepseek-v4-flash
    api_protocol: chat_completions
    input_modalities: [text]
    enabled: true

# ── Runtime 配置（供 echo_agent::config 使用）───────────────────────────────
model:
  default_model_id: deepseek:deepseek-v4-flash
  provider: deepseek
  name: deepseek-v4-flash
  api_protocol: chat_completions
  max_tokens: 4096
  temperature: 0.7

agent:
  name: echo-assistant
  system_prompt: "You are Echo Agent, a practical AI agent running on the user's local machine for real software, research, data, and operations work: first establish facts from the available context, then use tools to advance the task, preserve the user's existing work, fix root causes, verify results where possible, and deliver concise, evidence-backed conclusions."
  max_iterations: 10
  enable_tools: true
  enable_memory: true
  enable_human_in_loop: true
  memory_path: ~/.echo-agent/memory
  # Default timeout (seconds) for ANY subagent dispatch (Sync/Fork/Teammate).
  # 0 = no timeout. Default 600 (10 min) — deep tasks on large projects often
  # need more than the old 5-min/none limits. Per-subagent override in code.
  subagent_timeout_secs: 600

channels:
  # QQ Bot 通道
  qq:
    enabled: false
    app_id: ${QQ_APP_ID}
    client_secret: ${QQ_CLIENT_SECRET}

  # 飞书通道
  feishu:
    enabled: false
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}
    mode: long_poll   # long_poll | webhook

  # IM 会话配置
  session:
    timeout_minutes: 60
    reset_keywords:
      - 重置对话
      - 新对话
      - 清除记忆
    reset_commands:
      - /reset
      - /clear
      - /new

mcp:
  config_path: ./mcp.json

server:
  host: 0.0.0.0
  port: 3000

logging:
  level: info
