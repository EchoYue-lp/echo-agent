[package]
name = "echo_integration"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Integration layer for echo-agent framework (providers, mcp, channels)"
repository = "https://github.com/EchoYue-lp/echo-agent"
homepage = "https://github.com/EchoYue-lp/echo-agent"
documentation = "https://docs.rs/echo_integration"
keywords = ["ai", "agent", "llm", "mcp"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

exclude = ["**/.DS_Store"]

[features]
default = []
mcp = ["dep:tokio-tungstenite", "echo_core/mcp"]
channels = ["echo_core/channels", "dep:axum"]

[dependencies]
echo_core = { version = "0.2.0", path = "../echo-core" }
# From echo-providers
reqwest = { version = "0.12", features = ["json", "stream"] }
async-stream = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
futures = "0.3"
tracing = "0.1"
dotenvy = "0.15"
# From echo-mcp
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
# From echo-channels
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", optional = true }
prost = "0.13"
url = "2"
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
