[package]
name = "echo_channels"
version = "1.3.0"
edition = "2024"
description = "IM channel plugins for echo-agent (QQ Bot, Feishu, etc.)"

[dependencies]
echo_core = { version = "1.3.0", path = "../echo-core" }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
prost = "0.13"
url = "2"
rand = "0.9"
