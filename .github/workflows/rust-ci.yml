name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Run the repository verification gate
        run: ./scripts/verify.sh

  platform-check:
    name: platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Compile framework libraries for the host platform
        run: cargo check --workspace --lib --all-features --locked
      - name: Exercise Windows atomic file replacement
        if: runner.os == 'Windows'
        run: cargo test -p echo_core --lib --all-features --locked utils::fs::tests

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit vulnerabilities and maintenance warnings
        run: cargo audit --deny warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features --locked
