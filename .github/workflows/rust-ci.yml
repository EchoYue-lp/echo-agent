name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium 2>/dev/null || true
          sudo rm -rf /usr/lib/jvm 2>/dev/null || true
          df -h /

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo clippy workspace
        run: cargo clippy --workspace --all-targets

      - name: Cargo check workspace all targets
        run: cargo check --workspace --all-targets

      - name: Cargo test workspace
        run: cargo test --workspace

