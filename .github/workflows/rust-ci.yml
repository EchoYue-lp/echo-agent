name: Rust CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The exhaustive all-feature gate runs once on the task branch before merge.
# CI keeps the signals that a local macOS run cannot replace: Linux compilation
# and tests, Windows compatibility, and dependency policy. Test groups remain
# split because a single workspace test job exceeds the hosted runner's memory.
jobs:
  linux-quality:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check Linux formatting, lints, and featureless build
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo check --workspace --lib --no-default-features --locked

  linux-test:
    name: linux test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: framework
            packages: -p echo_agent
          - group: tools
            packages: -p echo_tools
          - group: learning
            packages: -p echo-agent-learning
          - group: foundations
            packages: >-
              -p echo_core -p echo_execution -p echo_integration -p echo_macros
              -p echo_orchestration -p echo_state
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      ECHO_SEMANTIC_TARGET_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install low-memory linker
        run: sudo apt-get install --no-install-recommends -y lld
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Test default feature surface
        run: cargo test ${{ matrix.packages }} --lib --tests --locked

  windows-check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Compile framework libraries for Windows
        run: cargo check --workspace --lib --all-features --locked
      - name: Exercise Windows atomic file replacement
        run: cargo test -p echo_core --lib --all-features --locked utils::fs::tests

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit vulnerabilities and maintenance warnings
        run: cargo audit --deny warnings
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify bundled dependency audit attribution
        run: |
          python -B -m unittest discover -s scripts/tests -p 'test_vendored_media_audit_lock.py'
          python -B scripts/generate-vendored-media-audit-lock.py --output "$RUNNER_TEMP/media-registry-origin.lock"
          cargo audit --deny warnings --file "$RUNNER_TEMP/media-registry-origin.lock"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Test the exact dependency diagnostic gate
        run: python -B -m unittest discover -s scripts/tests -p 'test_cargo_deny_baseline.py'
      - name: Check all cargo-deny policies and exact accepted duplicates
        id: deny_baseline
        run: |
          python -B scripts/check-cargo-deny-baseline.py --capture \
            --root "$GITHUB_WORKSPACE" \
            --baseline .cargo/cargo-deny-duplicate-baseline.json \
            --raw "$RUNNER_TEMP/cargo-deny.raw.log" \
            --receipt "$RUNNER_TEMP/cargo-deny.receipt.json"
      - name: Preserve the original scanner output and natural exit
        if: ${{ always() && steps.deny_baseline.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cargo-deny-original-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cargo-deny.raw.log
            ${{ runner.temp }}/cargo-deny.receipt.json
