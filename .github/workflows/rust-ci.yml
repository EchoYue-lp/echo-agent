name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      # --locked: fail if Cargo.lock would need updating, so CI never silently
  # regresses dependency versions vs the committed lockfile.
  - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  - run: cargo test --workspace --all-targets --all-features --locked
  # Verify the framework still compiles with no optional features (the
  # minimal-deps build). Scoped to the library crate — some inline test
  # modules assume feature-gated trait methods and don't build under
  # --no-default-features, which is fine for a lib-only smoke check.
  - run: cargo check --workspace --lib --no-default-features --locked
  # ── Safety grep gates (6-11) ────────────────────────────────────────
  # Ban panicking APIs and UTF-8 byte-slicing in PRODUCTION source (src/ and
  # sub-crate src/), excluding test modules. AGENTS.md forbids these; this CI
  # step keeps the ban enforced rather than relying on review.
  #
  # We scope to non-test files by excluding lines inside `#[cfg(test)]` blocks
  # (a coarse but effective heuristic via grep -v). Test code may legitimately
  # use .unwrap().
  - name: Ban .expect() / panic! / unreachable! / todo! in non-test src
    run: |
      set -e
      offending=$(grep -rn '\.expect(\|panic!\|unreachable!\|todo!' \
        --include='*.rs' src/ echo-core/src echo-execution/src echo-integration/src \
        echo-orchestration/src echo-state/src echo-tools/src 2>/dev/null \
        | grep -v '#\[cfg(test)\]' || true)
      if [ -n "$offending" ]; then
        echo "::error::Panicking API found in non-test source (AGENTS.md violation):"
        echo "$offending"
        exit 1
      fi
