name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The exhaustive all-feature gate runs once on the task branch before merge.
# CI keeps the signals that a local macOS run cannot replace: Linux compilation
# and tests, Windows compatibility, and dependency policy. Test groups remain
# split because a single workspace test job exceeds the hosted runner's memory.
jobs:
  linux-quality:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check Linux formatting, lints, and featureless build
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo check --workspace --lib --no-default-features --locked

  linux-test:
    name: linux test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: framework
            packages: -p echo_agent
          - group: tools
            packages: -p echo_tools
          - group: learning
            packages: -p echo-agent-learning
          - group: sdk-host
            packages: -p echo-sdk-host
          - group: foundations
            packages: >-
              -p echo_core -p echo_execution -p echo_integration -p echo_macros
              -p echo_orchestration -p echo_state
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v6
      - name: Install low-memory linker
        run: sudo apt-get install --no-install-recommends -y lld
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Test default feature surface
        run: cargo test ${{ matrix.packages }} --lib --tests --locked
      - name: Test core profile E2E (sdk-host group only)
        if: matrix.group == 'sdk-host'
        run: cargo test -p echo-sdk-host --features sdk-core-profile --lib --tests --locked

  windows-check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Compile framework libraries for Windows
        run: cargo check --workspace --lib --all-features --locked
      - name: Compile source-built SDK Host for Windows (all features)
        run: cargo check -p echo-sdk-host --all-features --locked
      - name: Exercise Windows atomic file replacement
        run: cargo test -p echo_core --lib --all-features --locked utils::fs::tests

  # Independent SDK contract signal: deterministic regeneration of the facade
  # inventory, parity manifest, extension schema and fixtures must produce
  # zero drift. Uses the exact nightly pinned in contracts/sdk/toolchain.json
  # for rustdoc JSON; contract drift cannot pass through code review alone.
  sdk-contract:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned rustdoc toolchain
        id: toolchain
        run: |
          toolchain=$(python3 -c "import json;print(json.load(open('contracts/sdk/toolchain.json'))['rustdoc']['toolchain'])")
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check SDK contract artifacts
        run: ./scripts/check-sdk-contracts.sh

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit vulnerabilities and maintenance warnings
        run: cargo audit --deny warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features --locked
