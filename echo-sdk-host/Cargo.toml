[package]
name = "echo-sdk-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Source-built standard ACP v1 Host for the echo-agent framework"

[lib]
name = "echo_sdk_host"
path = "src/lib.rs"

[[bin]]
name = "echo-agent-sdk-host"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = ["dep:agent-client-protocol", "dep:uuid", "echo_agent/acp", "echo_agent/mcp"]
# Negotiated `_echo_agent/*` core profile: explicit state root, handle
# registry, typed handlers, durable replay and bounded stdio. Isolated from
# `runtime` so standard-only consumers never compile the extension surface.
sdk-core-profile = [
    "runtime",
    "dep:echo-sdk-protocol",
    "dep:async-trait",
    "dep:base64",
    "dep:futures",
    "dep:tokio-util",
    "dep:tracing",
    "dep:sha2",
]
# Bidirectional `_echo_agent/extension/*` bridge over the core profile:
# host-language Tool/LlmClient/Store/HumanLoop/Hook/Callback/Agent
# implementations are reverse-invoked with lease, deadline and cancellation
# semantics. Requires the framework surfaces those proxies inject into.
sdk-extension-bridge = [
    "sdk-core-profile",
    "echo_agent/human-loop",
    "echo_agent/subagent",
]

[dependencies]
echo_agent = { version = "0.2.0", path = "..", default-features = false }
echo-sdk-protocol = { version = "0.1.0", path = "../echo-sdk-protocol", optional = true }
agent-client-protocol = { version = "=2.1.0", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
static_assertions = "1.1.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "process", "sync", "time"] }
