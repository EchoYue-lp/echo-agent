[package]
name = "echo_mcp"
version = "1.3.0"
edition = "2024"
description = "MCP protocol client for echo-agent"

[dependencies]
echo_core = { version = "1.3.0", path = "../echo-core" }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
