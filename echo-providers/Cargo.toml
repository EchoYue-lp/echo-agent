[package]
name = "echo_providers"
version = "1.0.0"
edition = "2024"
description = "LLM provider implementations for echo-agent"

[dependencies]
echo_core = { path = "../echo-core" }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures = "0.3"
tracing = "0.1"
dotenv = "0.15"
