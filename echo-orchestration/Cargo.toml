[package]
name = "echo_orchestration"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Orchestration layer for echo-agent framework (workflow, human-loop, tasks)"
repository = "https://github.com/EchoYue-lp/echo-agent"

[features]
default = []
websocket = ["dep:tokio-tungstenite"]

[dependencies]
echo_core = { version = "0.1.1", path = "../echo-core" }
echo_state = { version = "0.1.1", path = "../echo-state" }

# From echo-workflow
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

# From echo-human-loop
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
tokio-tungstenite = { version = "0.24", optional = true }

# From echo-tasks
dashmap = "6"
fastrand = "2"
tokio-util = { version = "0.7", features = ["rt"] }
