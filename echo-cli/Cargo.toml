[package]
name = "echo-cli"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "echo-agent"
path = "src/main.rs"

[dependencies]
echo_agent = { path = "..", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json", "stream"] }
tokio = { version = "1.47.1", features = ["full"] }
serde_json = "1.0.143"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
rustyline = "14"
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
