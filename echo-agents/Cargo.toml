[package]
name = "echo_agents"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Agent implementations for the echo-agent framework (ReactAgent, PlanExecute, Subagent)"
repository = "https://github.com/EchoYue-lp/echo-agent"
homepage = "https://github.com/EchoYue-lp/echo-agent"
documentation = "https://docs.rs/echo_agents"
keywords = ["ai", "agent", "llm", "react"]
categories = ["api-bindings", "asynchronous"]

[features]
default = []
plan-execute = []
self-reflection = []
subagent = []
full = ["plan-execute", "self-reflection", "subagent"]

[dependencies]
echo_core = { version = "0.2.0", path = "../echo-core" }
