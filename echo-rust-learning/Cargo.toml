[package]
name = "echo_rust_learning"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Executable Rust lessons for contributors to echo-agent"

[dependencies]
echo_agent = { version = "0.2.0", path = "..", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
